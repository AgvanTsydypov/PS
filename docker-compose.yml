services:
  # Python Scripts Service (for manual execution)
  python_scripts:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: polystars_python
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Максимальный размер одного лог-файла
        max-file: "3"        # Количество ротируемых файлов (всего 30MB макс)
        compress: "true"     # Сжимать старые логи
    environment:
      # PostgreSQL connection (external Managed DB or local for testing)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      DATABASE_URL: ${DATABASE_URL}
      # Legacy variables (backwards compatibility)
      LOCAL_DB_HOST: ${DB_HOST}
      LOCAL_DB_PORT: ${DB_PORT}
      LOCAL_DB_NAME: ${DB_NAME}
      LOCAL_DB_USER: ${DB_USER}
      LOCAL_DB_PASSWORD: ${DB_PASSWORD}
      
      # Supabase (опционально)
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      
      # Alchemy API
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY}
      
      # Python settings
      PYTHONUNBUFFERED: 1
    volumes:
      # Mount scripts directory
      - ./scripts:/app/scripts:ro
      # Mount output directories (read-write)
      - ./output:/app/output
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - polystars_network
    # Keep container running (for on-demand script execution)
    command: tail -f /dev/null
  
  # Scheduler Service (runs daily at 2 AM UTC)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: polystars_scheduler
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Максимальный размер одного лог-файла
        max-file: "3"        # Количество ротируемых файлов (всего 30MB макс)
        compress: "true"     # Сжимать старые логи
    environment:
      # PostgreSQL connection (external Managed DB or local for testing)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      DATABASE_URL: ${DATABASE_URL}
      # Legacy variables (backwards compatibility)
      LOCAL_DB_HOST: ${DB_HOST}
      LOCAL_DB_PORT: ${DB_PORT}
      LOCAL_DB_NAME: ${DB_NAME}
      LOCAL_DB_USER: ${DB_USER}
      LOCAL_DB_PASSWORD: ${DB_PASSWORD}
      
      # Supabase (опционально)
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      
      # Alchemy API
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY}
      
      # Python settings
      PYTHONUNBUFFERED: 1
      
      # Scheduler settings
      TZ: UTC
    volumes:
      # Mount scripts directory
      - ./scripts:/app/scripts:ro
      # Mount SQL directory for migrations
      - ./sql:/app/sql:ro
      # Mount output directories (read-write)
      - ./output:/app/output
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - polystars_network
    healthcheck:
      test: ["CMD", "pgrep", "cron"]
      interval: 1h
      timeout: 10s
      retries: 3

  # PgAdmin (GUI для управления БД)
  # Доступ осуществляется через SSH-туннель:
  # ssh -L 5050:localhost:5050 root@209.38.244.240
  # После подключения открыть в браузере: http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: polystars_pgadmin
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"       # Меньше для pgadmin (редко используется)
        max-file: "2"        # Всего 10MB макс
        compress: "true"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@polystars.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - polystars_network

  # Web stack (Next.js + FastAPI + Nginx)
  web_backend:
    build:
      context: .
      dockerfile: Dockerfile.web.backend
    container_name: polystars_web_backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DB_SSLMODE: ${DB_SSLMODE:-require}
      PYTHONUNBUFFERED: 1
    volumes:
      - ./my-keypair.json:/app/my-keypair.json:ro
    expose:
      - "8001"
    networks:
      - polystars_web_network

  web_frontend:
    build:
      context: .
      dockerfile: Dockerfile.web.frontend
      args:
        NEXT_PUBLIC_SEASON_API_BASE_URL: "/"
    container_name: polystars_web_frontend
    restart: unless-stopped
    depends_on:
      - web_backend
    expose:
      - "3000"
    networks:
      - polystars_web_network

  web_nginx:
    image: nginx:1.27-alpine
    container_name: polystars_web_nginx
    restart: unless-stopped
    depends_on:
      - web_backend
      - web_frontend
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./docker/nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - polystars_web_network

volumes:
  pgadmin_data:
    name: polystars_pgadmin_data

networks:
  polystars_network:
    name: polystars_network
    driver: bridge
  polystars_web_network:
    name: polystars_web_network
    driver: bridge
